[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "miltop"
version = "1.2.0"
description = "A lightweight, tile-based system monitor for Linux terminals"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [
  { name = "Miłosz" },
]
keywords = ["linux", "terminal", "tui", "system-monitor", "process-manager"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console :: Curses",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Monitoring",
]
dependencies = ["psutil>=5.9"]

[project.urls]
Homepage = "https://github.com/milosz-1710/miltop"
Issues = "https://github.com/milosz-1710/miltop/issues"
Source = "https://github.com/milosz-1710/miltop"

[project.scripts]
miltop = "miltop:main"

[tool.setuptools]
py-modules = ["miltop"]
