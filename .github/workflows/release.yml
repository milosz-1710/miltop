name: Build release packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release tag version, without the v prefix"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Read and validate version
        id: version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          version="${MANUAL_VERSION:-${GITHUB_REF_NAME#v}}"
          source_version="$(sed -n 's/^VERSION = "\([^"]*\)"/\1/p' miltop.py)"
          if [[ "$version" != "$source_version" ]]; then
            echo "Tag v${version} does not match source version ${source_version}" >&2
            exit 1
          fi
          echo "number=$version" >>"$GITHUB_OUTPUT"

      - name: Test application
        run: |
          python -m pip install .
          python -m py_compile miltop.py
          python -m unittest discover -s tests
          miltop --version
          miltop --snapshot

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes dpkg-dev rpm zstd
          python -m pip install build

      - name: Build Python, Debian, RPM, Arch and Gentoo packages
        env:
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          python -m build --outdir dist
          bash packaging/build-deb.sh "$VERSION" dist
          bash packaging/build-rpm.sh "$VERSION" dist
          bash packaging/build-arch.sh "$VERSION" dist
          cp packaging/arch/PKGBUILD "dist/miltop-${VERSION}.PKGBUILD"
          cp packaging/arch/.SRCINFO "dist/miltop-${VERSION}.SRCINFO"
          cp "packaging/gentoo/miltop-${VERSION}.ebuild" dist/
          cp packaging/gentoo/metadata.xml "dist/miltop-${VERSION}-gentoo-metadata.xml"
          dpkg-deb --info "dist/miltop_${VERSION}_all.deb"
          rpm -qip "dist/miltop-${VERSION}-1.noarch.rpm"
          tar --zstd -tf "dist/miltop-${VERSION}-1-any.pkg.tar.zst" | grep -E 'usr/bin/miltop|[.]PKGINFO'
          (cd dist && sha256sum * >SHA256SUMS)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" \
              --clobber \
              dist/*
          else
            notes=(--generate-notes)
            if [[ -f "release-notes/${tag}.md" ]]; then
              notes=(--notes-file "release-notes/${tag}.md")
            fi
            gh release create "$tag" \
              --title "miltop ${VERSION}" \
              "${notes[@]}" \
              dist/*
          fi
